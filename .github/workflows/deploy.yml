name: Deploy HotelOS from ZIP

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract HotelOS ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for HotelOS ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf hotelos-source
          mkdir -p hotelos-source

          unzip -q "$ZIP_FILE" -d hotelos-source

          echo "ZIP extracted successfully."

      - name: Detect HotelOS project
        shell: bash
        run: |
          set -e

          if [ -f "hotelos-source/hotel-os/package.json" ]; then
            echo "HOTEL_DIR=hotelos-source/hotel-os" >> "$GITHUB_ENV"

          elif [ -f "hotelos-source/package.json" ]; then
            echo "HOTEL_DIR=hotelos-source" >> "$GITHUB_ENV"

          else
            echo "ERROR: package.json not found."
            find hotelos-source -maxdepth 4 -type f
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.HOTEL_DIR }}
        run: npm ci

      - name: Build HotelOS
        working-directory: ${{ env.HOTEL_DIR }}
        env:
          VITE_DATA_SOURCE: supabase
          VITE_SUPABASE_URL: https://mfccirkculdetvjpfdiq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8m86pqA9VgN4DhVU4mXI9Q_2SinBZWj
          VITE_BASE_PATH: /Hotelos/
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -e

          if [ ! -f "${HOTEL_DIR}/dist/index.html" ]; then
            echo "ERROR: dist/index.html not found."
            exit 1
          fi

          echo "Build verified successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.HOTEL_DIR }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment successful
        run: |
          echo "HotelOS deployed successfully!"
          echo "https://echchiaa95.github.io/Hotelos/"
